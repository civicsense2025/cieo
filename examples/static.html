<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cieo without JavaScript</title>
  <link rel="stylesheet" href="../design/themes.css">
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="../design/primitives.css">
</head>
<body class="cieo">
  <main class="cieo-container cieo-stack cieo-surface">
    <h1 class="cieo-heading">A design foundation, not a framework requirement.</h1>
    <p class="cieo-prose">The server can use any language. These controls keep native HTML behavior.</p>
    <form class="cieo-stack" action="#example" method="get">
      <div class="cieo-field"><label for="name">Project name</label><input class="cieo-input" id="name" name="name" required></div>
      <label class="cieo-check"><input type="checkbox" name="ready">Ready for review</label>
      <button class="cieo-button" data-variant="primary" type="submit">Preview a form submission</button>
    </form>
    <details class="cieo-disclosure"><summary>Native disclosure</summary><p>No JavaScript is required to open this section.</p></details>
  </main>
</body>
</html>
