# Temporary, branch-only source transfer. Removed after the verified commit lands.
name: Materialize reviewed catalogue source
on:
  push:
    branches: [design/catalogue-ui-refinement]
    paths: ['.catalogue-transfer/**']
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'civicsense2025/cieo' && github.ref == 'refs/heads/design/catalogue-ui-refinement'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Verify the baseline and apply exact reviewed source bytes
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = '9073f9fadaf4e936e6627a55da7b40df245aaeb5'
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, shutil
          root = pathlib.Path.cwd()
          packed = base64.b64decode(''.join((root / '.catalogue-transfer' / f'{i}.b64').read_text() for i in range(6)), validate=True)
          assert hashlib.sha256(packed).hexdigest() == 'd4d6673c072703561db997e95cff960163d677b6d4adc3c7c213b96b9af10760', 'Transfer checksum mismatch'
          entries = json.loads(lzma.decompress(packed))
          assert len(entries) == 46
          pending = []
          for entry in entries:
              name = entry['path']
              assert name == '.gitignore' or name.startswith(('atoms/web/', 'docs/', 'scripts/', 'test/catalogue/'))
              target = root / name
              assert target.resolve().is_relative_to(root)
              assert not target.is_symlink()
              if entry['before'] is None:
                  assert not target.exists(), f'New path already exists: {name}'
                  text = ''
              else:
                  before = target.read_bytes()
                  assert hashlib.sha256(before).hexdigest() == entry['before'], f'Baseline changed: {name}'
                  text = before.decode('utf-8')
              for start, end, replacement in reversed(entry['edits']):
                  text = text[:start] + replacement + text[end:]
              data = text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == entry['after'], f'Reconstruction mismatch: {name}'
              pending.append((target, data))
          for target, data in pending:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          shutil.rmtree(root / '.catalogue-transfer')
          print(f'Verified and applied {len(pending)} source files.')
          PY
      - name: Generate both existing catalogue documents
        run: |
          node scripts/build-library.mjs
          node scripts/build-catalogue.mjs
          node --test test/catalogue/build.test.mjs
          bash scripts/check-brand.sh
          git diff --check
      - name: Commit only to the requested feature branch, without force
        run: |
          git config user.name 'Cieo catalogue automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine the real 345-atom collection, live inspectors and 25 recipe UIs'
          git push origin HEAD:refs/heads/design/catalogue-ui-refinement
