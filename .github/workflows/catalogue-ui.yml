name: Catalogue UI
on:
  push:
    branches: [design/catalogue-ui-refinement]
  pull_request:
    paths: ['atoms/web/**', 'scripts/build-library.mjs', 'test/catalogue/**', '.github/workflows/catalogue-ui.yml']
permissions:
  contents: read
concurrency:
  group: catalogue-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build-library.mjs
      - name: Install browser for visual review
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Capture public visual references
        run: python test/catalogue/capture_references.py
      - name: Package reviewed source without Git credentials or dependencies
        if: always()
        run: |
          mkdir -p review-artifact
          git archive --format=tar.gz --output=review-artifact/cieo-source.tar.gz HEAD
          cp docs/library.html review-artifact/library.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cieo-catalogue-review
          path: review-artifact/
          retention-days: 7
          if-no-files-found: error
