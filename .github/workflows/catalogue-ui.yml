name: Catalogue UI
on:
  pull_request:
    paths:
      - 'atoms/web/**'
      - 'scripts/build-library.mjs'
      - 'test/catalogue/**'
      - '.github/workflows/catalogue-ui.yml'
permissions:
  contents: read
concurrency:
  group: catalogue-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test && node --test test/catalogue/model.test.mjs
      - name: Build actual catalogue and prepare review artifacts
        run: |
          mkdir -p catalogue-artifacts
          git archive HEAD > catalogue-artifacts/source.tar
          node scripts/build-library.mjs
          cp docs/library.html catalogue-artifacts/Cieo-Library.html
          node scripts/build-catalogue.mjs
      - name: Install isolated browser test tools
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Exercise the real components
        run: node test/catalogue/browser.mjs
      - name: Preserve screenshots, reports, source and standalone catalogue
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cieo-catalogue-${{ github.event.pull_request.head.sha }}
          path: catalogue-artifacts/
          retention-days: 14
          if-no-files-found: error
