name: Catalogue UI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalogue-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Build and test the existing motion library
        run: npm ci && npm test
      - name: Prepare review sources and visual references
        run: |
          mkdir -p artifacts/references
          git archive --format=zip HEAD -o artifacts/cieo-source.zip
          curl --fail --location --max-time 30 https://recollect.so/images/recollect-ipad-hero.png -o artifacts/references/recollect-ipad.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: catalogue-review
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
