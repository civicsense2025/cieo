name: Design system
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: design-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
  swift:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Components read styling from the host
        run: |
          scripts/check-swift-literals.sh
          caught=$(scripts/check-swift-literals.sh scripts/fixtures/hard-coded-styling.swift.fixture | grep -c 'fixture:' || true)
          test "$caught" -eq 5 || { echo "The styling check missed hard-coded lines in its fixture ($caught of 5)"; exit 1; }
      - run: swift build && swift test
